name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Build installable development APK
        env:
          KEYSTORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: androiddebugkey
        run: bash tools/build_apk.sh app/build/outputs/manual/VeilAura-Bale-Selector-debug.apk
      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: bale-selector-debug-${{ github.sha }}
          path: app/build/outputs/manual/VeilAura-Bale-Selector-debug.apk
          retention-days: 7
