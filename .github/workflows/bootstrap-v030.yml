name: Publish initial v0.3.0-beta release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify packaged APK
        run: |
          echo 'de85c84f4a8cc6ca1105fe0c34f1d3b45dd552f6821826a4c7958fe4f8fa06f8  release-assets/VeilAura-Bale-Selector-0.3.0-beta.apk' | sha256sum --check -
      - name: Create initial GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0-beta >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.3.0-beta \
            release-assets/VeilAura-Bale-Selector-0.3.0-beta.apk \
            release-assets/SHA256.txt \
            release-assets/signature.txt \
            --target "$GITHUB_SHA" \
            --title 'انتخاب‌گر مخاطبین بله 0.3.0-beta' \
            --notes-file RELEASE_NOTES_FA.md \
            --prerelease
